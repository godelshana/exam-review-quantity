<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数量关系 · 五题练习与真题测试</title>
<style>
:root{color-scheme:light;--green:#136858;--soft:#e8f3ef;--ink:#19312c;--muted:#63736e;--line:#dae5df}*{box-sizing:border-box}body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f4f7f4;color:var(--ink);margin:0 auto;padding:20px;max-width:880px;line-height:1.65}h1{font-size:26px;letter-spacing:.04em;margin:0}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0}.sub,.mini{color:var(--muted);font-size:13px}.card{background:white;border:1px solid var(--line);border-radius:16px;margin:16px 0;padding:22px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:block;margin:10px 0;font-size:14px}select,input,button{font:inherit}select,button{min-height:44px;border-radius:9px;border:1px solid var(--line);padding:8px 13px;background:#fff;color:var(--ink)}button{cursor:pointer}button.primary{background:var(--green);border-color:var(--green);color:white}button:disabled{cursor:default;opacity:.6}button:focus-visible,select:focus-visible{outline:3px solid #d3931e;outline-offset:2px}button.opt{width:100%;text-align:left;margin:5px 0;min-height:50px}.right{background:#e1f3e4!important;border-color:#287445!important}.wrong{background:#fff0ed!important;border-color:#ac4432!important}.tag{padding:3px 9px;background:var(--soft);border-radius:10px;font-size:12px}.stem{font-size:18px;line-height:1.9;white-space:pre-wrap;margin:20px 0}.feedback{white-space:pre-wrap;line-height:1.85;background:#f3f6f3;padding:16px;border-radius:10px;margin:14px 0}.warning{background:#fff8e5;border:1px solid #e9d8a7;padding:12px;border-radius:10px}.timer{font-variant-numeric:tabular-nums;margin-left:auto}.slow{color:#a43a20}progress{width:100%;height:8px;accent-color:var(--green)}details{border-top:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:600;min-height:44px;padding:9px 4px}summary:focus-visible{outline:3px solid #d3931e;outline-offset:2px;border-radius:4px}.review-body{white-space:pre-wrap;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stats strong{display:block;font-size:25px}.stats span{font-size:12px;color:var(--muted)}[hidden]{display:none!important}footer{margin:25px 0;font-size:12px;color:var(--muted)}@media(max-width:550px){body{padding:12px}.card{padding:16px}h1{font-size:22px}.stem{font-size:17px}.stats{grid-template-columns:repeat(2,1fr)}select{max-width:100%}}
.question-image{display:block;background:white;max-width:100%;height:auto;margin:12px 0}.solution-part{margin:14px 0;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.stem,.review-body,.feedback{overflow-wrap:anywhere}.stats{margin:12px 0}select{max-width:100%}.question-image[alt="公式"]{display:inline-block;vertical-align:middle;max-height:3.5em;width:auto;margin:0 3px}.row label{min-width:0;max-width:100%}#topicFilter{max-width:280px}#catalogItems summary{overflow-wrap:anywhere}</style>
<link rel="icon" href="data:,"></head><body>
<header><div class="mini">数量关系 · 识别快 · 选得准 · 知道何时跳过</div><h1>五题天梯</h1><p class="sub">真题 + 模拟 · 每题三路题解：常规、快解、排除法</p></header>
<div id="loadError" class="warning" role="alert" hidden></div>
<section id="menu" class="card"><h2>选一轮 · 默认五题</h2>
<label>学习模式 <select id="source"><option value="train">练习模式：真题 + 模拟</option><option value="validation">测试模式：2024—2026 国考 / 广东省考</option><option value="transfer">迁移混编：训练 + 未曝光真题</option><option value="validation-review">测试复盘：已曝光真题</option></select></label>
<p id="bankInfo" class="mini"></p>
<div class="row"><label>题量 <select id="length"><option selected>5</option><option>10</option><option>15</option><option>20</option><option>30</option></select></label><label>反馈 <select id="mode"><option value="practice">即时题解</option><option value="exam">整轮后题解</option></select></label><label id="validationTierLabel" hidden>复盘分组 <select id="validationTier"><option value="V1">正式题</option><option value="V2">暂定题</option></select></label></div>
<div class="row"><label>策略 <select id="strategy"><option value="ladder">天梯训练</option><option value="random">随机混合</option><option value="fresh">优先新题</option><option value="weak">强化错题与慢题</option></select></label><label>当前阶 <select id="level"><option>入门</option><option>熟练</option><option>深化</option><option>综合</option><option value="all">跨阶混合</option></select></label></div>
<div id="trainingFilters" class="row"><label>地区 <select id="provinceFilter"><option value="all">所有地区</option></select></label><label>考点 <select id="topicFilter"><option value="all">全部考点</option></select></label></div>
<div id="ladderInfo" class="feedback"></div>
<div class="row"><button id="start" class="primary">开始 5 题</button><button id="reviewPool">错题 / 慢题再练</button></div>
<p id="filterInfo" class="mini" aria-live="polite"></p>
<details><summary>使用说明</summary><p>先独立作答再看题解：每题给出考点知识点、常规解法、快解与排除法。猜对请标记"猜测"，暂跳不算答对。</p><p>训练达标（本阶最近至少 10 题、正确率 ≥80%、快速独立 ≥60%）后建议升阶。测试轮整卷倒计时、不可暂停，每题只计一次首测。</p></details>
<details id="catalogPanel"><summary>题库目录 · 单题练 / 争议题研读</summary><label>目录范围 <select id="catalogType"><option value="train">可练题目</option><option value="study">争议 / 缺损题（仅研读）</option></select></label><p id="catalogCount" class="mini"></p><div id="catalogItems"></div><div class="row"><button id="catalogPrev">上一页</button><button id="catalogNext">下一页</button></div></details>
<section id="metrics" aria-live="polite"></section>
<button id="export">导出练习记录</button><span id="storageStatus" class="mini"></span>
</section>
<section id="quiz" class="card" hidden><div class="row"><span id="qno" class="tag"></span><span id="qsource" class="tag"></span><span id="timer" class="timer" role="timer">0s</span></div><progress id="progress" max="1" value="0" aria-label="本轮进度"></progress><p id="samplingNote" class="mini" aria-live="polite"></p><div id="stem" class="stem"></div><div id="opts" role="group" aria-label="答案选项"></div>
<div class="row"><label>这次选择 <select id="confidence"><option value="未标记">未标记</option><option>确定</option><option>排除后选</option><option>猜测</option></select></label><button id="insight">思路已定</button><button id="hint">看提示</button><button id="pause">暂停</button></div>
<div id="hintText" class="feedback" hidden></div><div id="feedback" class="feedback" aria-live="polite" hidden></div>
<div class="row"><button id="skip">暂跳（J）</button><button id="next" class="primary" hidden>下一题（回车）</button><button id="exit">结束本轮</button></div><p class="mini">键盘 A–D 选择 · J 暂跳 · 回车下一题</p></section>
<section id="result" class="card" hidden></section>
<footer>记录保存在本浏览器 · 可随时导出 · 2026-09-12</footer>
<script src="手写模拟题_100.js"></script><script src="原创复合24.js"></script><script src="training_families.js"></script><script src="authored_methods.js"></script><script src="datasets/banks.js"></script><script src="datasets/authored_policy.js"></script><script src="full_audit/banks.js"></script><script src="core.js"></script><script src="app.js"></script>
</body></html>
